<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VR + Interfaz Cerebro-Computadora (BCI) - Demo</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
	<article id="panel">
		<h1>Diadema BCI (simulada)</h1>
		
		<section class="metric">
			<label>Atención <span id="attn-v">0%</span></label>
			<div class="bar" id="attn"><span></span></div>
		</section>
		
		<section class="metric">
			<label>Meditación <span id="medi-v">0%</span></label>
			<div class="bar" id="medi"><span></span></div>
		</section>
		
		<button id="connect">Conectar dispositivo</button>
		<button id="blink">Simular parpadeo (acción) <kbd>Espacio</kbd></button>
		
		<section class="status" id="status">
			Estado: <b>desconectado</b><br>
			· La <b>atención</b> eleva y agranda la esfera .<br>
			· La <b>meditación</b> cambia su color (frío-cálido) .<br>
			. Un <b>parpadeo</b> dispara un pulso/teletransporte.
		</section>
	</article>
	
	<a-scene id="escena" background="color: #0d1020" renderer="colorManagement: true">
		<a-entity id="rig" position="0 1.6 4">
			<a-camera wasd-controls look-controls></a-camera>
		</a-entity>

		<a-light type="ambient" color="#445"></a-light>
		<a-light type="point" intensity="0.9" position="2 4 4"></a-light>
		
		<a-plane id="suelo" rotation="-90 0 0" width="40" height="40" color="#1a1f3a" material="shader: flat"></a-plane>

		<a-sphere id="orb" position="0 1.5 -3" radius="0.6" color="#2a9df4" material="metalness: 0.3; roughness : 0.4">
			<a-animation attribute="rotation" to="0 360 0" dur="8000" repeat="indefinite" easing="linear"></a-animation>
		</a-sphere>

		<a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9">
			<a-animation attribute="rotation" to="0 360 0" dur="8000" repeat="indefinite" easing="linear"></a-animation>
		</a-box>
        
        <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>	

		<a-ring id="pulse" position="0 1.5 -3" radius-inner="0.7" radius-outer="0.8" color="#3ad6c0" visible="false" material="shader: flat; opacity: 0.8; transparent: true"></a-ring>
		<a-text id="hud3d" value="" position="-1.2 2.6 -3" color="#fff" width="4"></a-text>
		
		<a-text id="nombre" value="" position="-1.2 4 -3" color="#fff" width="4"></a-text>
	</a-scene>
	
	<script src="script.js"></script>
</body>
</html>
